<!doctype html><meta charset="utf-8"><title>Headless</title>
<body style="background:#111;color:#cfc;font:12px monospace"><pre id="o"></pre>
<script>
// Test de la simulation sans rendu : headless.html?sc=aqua|fish|pond|newtank|cross&days=300 (scripts rechargés sans cache)
(async () => {
for (const f of ['data', 'genetics', 'sim']) {
  const code = await (await fetch(`../js/${f}.js`, { cache: 'no-store' })).text();
  const el = document.createElement('script'); el.textContent = code; document.head.appendChild(el);
}
const q = new URLSearchParams(location.search);
const days = +q.get('days') || 200, sc = q.get('sc') || 'aqua';
const tanks = {
  aqua: { env: 'aquarium', volume: 30, substrate: 'sand', water: 'tap_soft', plants: ['moss', 'hygro'], mature: true,
          eq: { filter: 'sponge', heater: true, target: 24, light: 8 }, shrimp: { neo_cherry: 10, neo_blue: 6 } },
  fish: { env: 'aquarium', volume: 60, substrate: 'black', water: 'tap_soft', plants: ['moss'], mature: true,
          eq: { filter: 'sponge', heater: true, target: 24, light: 8 }, shrimp: { neo_wild: 10, neo_cherry: 10, neo_yellow: 10 }, fish: 6 },
  pond: { env: 'pond', volume: 500, substrate: 'earth', water: 'tap_soft', plants: ['egeria', 'lemna'], mature: true,
          eq: {}, shrimp: { neo_wild: 20, neo_cherry: 10 } },
  newtank: { env: 'aquarium', volume: 30, substrate: 'soil', water: 'ro_gh', plants: ['moss'], mature: false,
          eq: { filter: 'sponge', heater: true, target: 22, light: 8 }, shrimp: { car_crs: 10 } },
  cross: { env: 'aquarium', volume: 60, substrate: 'sand', water: 'tap_soft', plants: ['moss', 'hygro'], mature: true,
          eq: { filter: 'sponge', heater: true, target: 24, light: 8 }, shrimp: { neo_cherry: 6, neo_blue: 6 } },
};
const out = [];
const t0 = performance.now();
const W = Sim.newWorld({ mode: 'sandbox', events: sc !== 'cross', mutRate: 1, season: 'spring', tank: tanks[sc] });
const T = W.tanks[0];
for (let d = 1; d <= days; d++) {
  // joueur attentif
  if (T.heaterStuck) Sim.A.fixHeater(W, T);
  if (T.w.level < .85) Sim.A.topOff(W, T, 'tap_soft');
  if ((T.pred.hydra > 20 || T.pred.plan > 20) && T.treat.fenben < W.t) Sim.A.treat(W, T, 'fenben');
  if (T.w.no2 > .3 || T.w.no3 > 35) Sim.A.waterChange(W, T, 30, T.cfg.water);
  if (sc !== 'pond') { Sim.A.feed(W, T, 'granules'); if (d % 7 === 0) Sim.A.waterChange(W, T, 20, T.cfg.water); }
  Sim.advance(W, 24);
  if (d % 20 === 0 || d <= 2) {
    const st = Sim.popStats(T), w = T.w, m = st.mean;
    const dd = {}; for (const k in W.stats.dead) { const x = W.stats.dead[k] - ((window._pd || {})[k] || 0); if (x) dd[k] = x; }
    window._pd = Object.assign({}, W.stats.dead);
    out.push(`J${d} n=${st.n} ad=${st.adults} juv=${st.juv} ber=${st.berried} gen=${W.stats.maxGen} | T=${w.temp.toFixed(1)} pH=${w.ph.toFixed(2)} GH=${w.gh.toFixed(1)} NO2=${w.no2.toFixed(2)} NO3=${w.no3.toFixed(0)} | tOpt=${(m.tOpt||0).toFixed(1)}±${(m.tTol||0).toFixed(1)} dens=${(m.dens||0).toFixed(2)} hyd=${T.pred.hydra.toFixed(0)} pla=${T.pred.plan.toFixed(0)} fish=${T.pred.fish} morts=${JSON.stringify(dd)}`);
    if (sc === 'cross') {
      const byGen = {};
      for (const sh of T.shrimp) { const g = byGen[sh.gen] || (byGen[sh.gen] = {}); const k = Gen.colorClass(sh.g); g[k] = (g[k] || 0) + 1; }
      for (const [g, m] of Object.entries(byGen)) out.push(`   G${g}: ` + Object.entries(m).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${k}:${n}`).join('  '));
    }
  }
}
const mo = {}; for (const sh of T.shrimp) { const k = Gen.phenotype(sh.g); mo[k] = (mo[k] || 0) + 1; }
out.push('phénotypes: ' + JSON.stringify(Object.entries(mo).sort((a, b) => b[1] - a[1]).slice(0, 10)));
out.push('morts: ' + JSON.stringify(W.stats.dead), 'nés: ' + W.stats.born + ' mutations: ' + W.stats.mutations, 'temps: ' + Math.round(performance.now() - t0) + ' ms');
document.getElementById('o').textContent = out.join('\n');
})();
</script>
